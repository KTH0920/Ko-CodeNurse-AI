version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ko-codenurse-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./vector_store:/app/vector_store
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ko-codenurse-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ko-codenurse-frontend
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_API_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ko-codenurse-network

networks:
  ko-codenurse-network:
    driver: bridge

